<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script>
/*__NOTE_MEDIA__*/
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function emptyState(){return {notes:[],assets:[],maps:[]}}
function removeSampleContent(vault){vault.maps=vault.maps.filter(m=>!m.demo&&m.id!=='demo');vault.notes=vault.notes.filter(n=>!['note-harbour','note-forest','note-spire'].includes(n.id));return vault}
let loaded=false;let state,view='atlas',activeMap=null,map,overlay,markers,storageOK=false,saveChain=Promise.resolve(),recent=[],lastFocus,toastTimer;
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),4500)}
function modal(html,wide=false){clearNoteMaps();lastFocus=document.activeElement;$('dialog').classList.toggle('wide',wide);$('dialog').innerHTML='<div class="dialog-header"><h2 id="modalTitle">'+html.title+'</h2><button class="close" id="closeModal" aria-label="Close dialog">×</button></div>'+html.body;$('modal').classList.remove('hidden');$('closeModal').onclick=closeModal;setTimeout(()=>$('dialog').querySelector('input,button,select')?.focus(),50)}
function closeModal(){clearNoteMaps();$('modal').classList.add('hidden');lastFocus?.focus();noteOrigin=null}
$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal()}if(e.key==='Tab'&&!$('modal').classList.contains('hidden')){const a=[...$('dialog').querySelectorAll('button,input,select,textarea,a[href]')].filter(x=>!x.disabled);if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus()}}});
async function api(url,options){const r=await fetch(url,options);if(!r.ok){let m;try{m=(await r.json()).error}catch{}throw Error(m||'Request failed. Please try again.')}return r}
function save(){if(!loaded)return Promise.reject(Error("Vault storage is offline. Reload before making changes."));const snapshot=JSON.stringify(state);$('statusText').textContent='Saving…';saveChain=saveChain.catch(()=>{}).then(()=>api('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:snapshot})).then(()=>{$('statusText').textContent='All changes saved';storageOK=true}).catch(e=>{$('statusText').textContent='Changes not saved';toast(e.message);throw e});return saveChain}
let viewingVaultMap=false;
let mapTrail=[],noteOrigin=null,activeNoteId=null;
function captureMapView(){const selected=current();if(!selected)return null;return {id:selected.id,center:map?.getCenter(),zoom:map?.getZoom()}}
function updateReturnButton(){const available=mapTrail.some(entry=>state.maps.some(m=>m.id===entry.id));$('returnMap')?.classList.toggle('hidden',!available||!(view==='atlas'||viewingVaultMap))}
function returnToMap(){
 const target=noteOrigin||mapTrail.pop();
 if(!target)return;
 if(!state.maps.some(m=>m.id===target.id)){noteOrigin=null;updateReturnButton();return toast('Previous map is no longer available.');}
 noteOrigin=null;openAtlasMap(target.id,{remember:false,restore:target});
}
function current(){return state.maps.find(m=>m.id===activeMap)||state.maps.find(m=>!m.sourceNoteId)}
async function syncVaultAtlas(){
 const next=await buildVaultAtlas(state,async url=>{const image=new Image();image.src=url;await image.decode();return {width:image.naturalWidth,height:image.naturalHeight}});
 state.maps=next;
}
function openAtlasMap(id,options={}){
 const selected=state.maps.find(m=>m.id===id);if(!selected)return toast('Map is not available yet.');
 if(options.remember!==false&&activeMap!==id&&(view==='atlas'||viewingVaultMap||noteOrigin)){const previous=noteOrigin||captureMapView();if(previous){mapTrail.push(previous);if(mapTrail.length>100)mapTrail.shift()}}
 closeModal();noteOrigin=null;activeMap=id;
 if(selected.sourceNoteId){setView('maps');viewingVaultMap=true;$('mapsView').classList.add('hidden');$('atlasView').classList.remove('hidden');$('backToMaps').classList.remove('hidden');$('pageTitle').textContent=selected.name;$('breadcrumb').textContent='My maps / '+selected.name}
 else setView('atlas');
 document.title=selected.name+' · Everwood';loadMap();if(options.restore?.center&&map)map.setView(options.restore.center,options.restore.zoom);updateReturnButton();setTimeout(()=>map?.invalidateSize(),50);
}
function render(){
 const {notes:regularNotes,mapNotes}=partitionVaultNotes(state.notes);
 $('noteCount').textContent=regularNotes.length;
 $('mapCount').textContent=state.maps.filter(m=>!m.sourceNoteId).length+mapNotes.length;
 const recentNotes=recent.length?recent.map(id=>regularNotes.find(n=>n.id===id)).filter(Boolean):regularNotes.slice(0,5);
 $('sideNotes').innerHTML=recentNotes.map(n=>'<button data-note="'+esc(n.id)+'">▤ &nbsp; '+esc(n.title)+'</button>').join('');
 const q=$('search').value.toLowerCase();
 const matches=n=>(n.title+' '+n.text+' '+n.path).toLowerCase().includes(q);
 const notes=regularNotes.filter(matches);
 $('recentCards').innerHTML=notes.slice(0,3).map(noteCard).join('')||'<div class="empty">No notes.</div>';
 $('allNotes').innerHTML=notes.map(noteCard).join('')||'<div class="empty">No matching notes.</div>';
 $('notesSummary').textContent=notes.length+' notes';
 $('mapSelect').innerHTML=state.maps.filter(m=>view==='maps'?!!m.sourceNoteId:!m.sourceNoteId).map(m=>'<option value="'+esc(m.id)+'">'+esc(m.name)+'</option>').join('');
 $('mapSelect').value=current()?.id||'';
 const vaultMapCards=mapNotes.filter(matches).map(n=>'<button class="card" data-note="'+esc(n.id)+'"><div class="card-label">Leaflet map</div><h3>'+esc(n.title)+'</h3><p>'+esc(n.path)+'</p></button>').join('');
 const atlasMapCards=state.maps.filter(m=>!m.sourceNoteId).filter(m=>m.name.toLowerCase().includes(q)).map(m=>'<button class="card" data-map="'+esc(m.id)+'"><div class="card-label">◇ &nbsp; '+'Fantasy map'+'</div><h3>'+esc(m.name)+'</h3><p>'+m.width+' × '+m.height+' px &nbsp; · &nbsp; '+m.pins.length+' locations</p></button>').join('');
 $('allMaps').innerHTML=vaultMapCards+atlasMapCards||'<div class="empty">No maps.</div>';
 renderPins();renderMapNote();
}
function noteCard(n){const excerpt=n.text.replace(/^---[\s\S]*?---/,'').replace(/[#>*`\[\]!]/g,'').replace(/\n/g,' ').replace(n.title,'').trim();return '<button class="card" data-note="'+esc(n.id)+'"><div class="card-label">▤ &nbsp; '+esc(n.tag||n.path.split('/').slice(0,-1).join(' / ')||'Note')+'</div><h3>'+esc(n.title)+'</h3><p>'+esc(excerpt)+'</p><div class="card-footer"><span>'+esc(n.path)+'</span><span>↗</span></div></button>'}
function setView(v){document.title='Everwood';clearNoteMaps();view=v;if(v!=='note'){activeNoteId=null;noteOrigin=null;}viewingVaultMap=false;$('backToMaps').classList.add('hidden');if(v==='atlas'&&current()?.sourceNoteId)activeMap=state.maps.find(m=>!m.sourceNoteId)?.id;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===(v==='note'?'notes':v)));for(const x of ['atlas','notes','maps','note'])$(x+'View').classList.toggle('hidden',x!==v);$('breadcrumb').textContent={atlas:'World atlas',notes:'All notes',maps:'My maps',note:'Notes'}[v];$('pageTitle').textContent={atlas:'World atlas',notes:'Notes',maps:'Maps',note:'Note'}[v];$('sidebar').classList.remove('open');if(v==='atlas'){loadMap();setTimeout(()=>map?.invalidateSize(),50)}render();updateReturnButton()}
document.addEventListener('click',e=>{const v=e.target.closest('[data-view]'),n=e.target.closest('[data-note]'),m=e.target.closest('[data-map]');if(v)setView(v.dataset.view);if(n)openNote(n.dataset.note);if(m)openAtlasMap(m.dataset.map)});
function initMap(){if(!window.L){$('map').innerHTML='<div class="empty">Leaflet could not load. Check your internet connection and reload.</div>';return}map=L.map('map',{crs:L.CRS.Simple,minZoom:-4,maxZoom:3,zoomControl:false});L.control.zoom({position:'topright'}).addTo(map);markers=L.layerGroup().addTo(map);addMapControls(map,markers,true);loadMap()}
function loadMap(){
 if(!map)return;const m=current();
 if(overlay){map.removeLayer(overlay);overlay=null}markers.clearLayers();
 $('mapError').classList.toggle('hidden',!!m&&!m.error);
 $('mapError').textContent=m?.error||(!m?'Choose a map from My maps.':'');

 if(!m||m.error){$('locations').innerHTML='';$('pinCount').textContent='0 places';return}
 activeMap=m.id;const bounds=m.bounds||[[0,0],[m.height,m.width]];
 map.setMinZoom(-12);map.setMaxZoom(m.maxZoom||3);
 overlay=L.imageOverlay(m.url,bounds).addTo(map);
 map.invalidateSize();map.fitBounds(bounds);map.setMaxBounds(L.latLngBounds(bounds).pad(.6));
 render();
}
function markerSymbol(type){
 const d=markerDefinition(state,type),style='color:#fff;font-size:14px;line-height:1';
 if(d.isImage){const url=mediaURL(state.assets,d.iconName);if(url)return '<img class="marker-custom-image" src="'+esc(url)+'" alt="" style="width:16px;height:16px;filter:brightness(0) invert(1)">'}
 return '<i aria-hidden="true" class="fa-solid fa-'+esc(d.isImage?'map-marker':d.iconName)+'" style="'+style+'"></i>';
}
function leafletMarkerIcon(type){const d=markerDefinition(state,type);return L.divIcon({className:'map-pin',html:'<div class="pin" style="background-color:'+d.color+';border-color:'+d.color+'"><span>'+markerSymbol(type)+'</span></div>',iconSize:[32,32],iconAnchor:[16,34]})}

function renderPins(){const m=current();if(!m)return;const q=$('search').value.toLowerCase();const pins=m.pins.filter(p=>(p.name+' '+p.description).toLowerCase().includes(q)).sort((a,b)=>String(a.kind||'default').localeCompare(String(b.kind||'default'),undefined,{sensitivity:'base',numeric:true})||String(a.name||'').localeCompare(String(b.name||''),undefined,{sensitivity:'base',numeric:true}));$('pinCount').textContent=pins.length+' places';$('locations').innerHTML=pins.map(p=>'<button class="location" data-pin="'+esc(p.id)+'"><span class="pin-symbol" style="background-color:'+markerDefinition(state,p.kind).color+';border-color:'+markerDefinition(state,p.kind).color+'">'+markerSymbol(p.kind)+'</span><span><b>'+esc(p.name)+'</b><small>'+esc(p.kind)+(p.noteId?' · Linked note':'')+'</small></span></button>').join('')||'<div class="empty">No locations.</div>';if(!markers)return;markers.clearLayers();pins.forEach(p=>{const mk=L.marker([p.y,p.x],{icon:leafletMarkerIcon(p.kind)}).addTo(markers);mk.bindTooltip(esc(p.name),{direction:'top',offset:[0,-30]});mk.on('click',()=>showPin(p));mk.on('contextmenu',()=>pinDialog({lat:p.y,lng:p.x},p))})}
$('locations').onclick=e=>{const b=e.target.closest('[data-pin]');if(b){const p=current().pins.find(p=>p.id===b.dataset.pin);showPin(p)}};
function showPin(p){
 if(!p)return;
 if(p.noteId)return openNote(p.noteId);
 if(p.mapId)return openAtlasMap(p.mapId);
 toast('This pin has no linked note or map.');
}

function pinDialog(pos,p){if(p?.obsidian)return toast('Edit this marker in Obsidian; changes sync automatically.');const targetMap=current();if(!targetMap)return;modal({title:p?'Edit location':'A new place in your world',body:'<form id="pinForm"><label class="field">Location name<input id="pinName" required maxlength="100" value="'+esc(p?.name||'')+'" placeholder="e.g. The Lantern & Lark"></label><label class="field">Type<select id="pinKind">'+['Settlement','Landmark','Adventure'].map(k=>'<option'+(p?.kind===k?' selected':'')+'>'+k+'</option>').join('')+'</select></label><label class="field">Connect an Obsidian note<select id="pinNote"><option value="">No linked note</option>'+partitionVaultNotes(state.notes).notes.map(n=>'<option value="'+esc(n.id)+'"'+(p?.noteId===n.id?' selected':'')+'>'+esc(n.title)+'</option>').join('')+'</select></label><label class="field">A little context<textarea id="pinDesc" maxlength="1000">'+esc(p?.description||'')+'</textarea></label><div class="dialog-actions">'+(p?'<button type="button" id="deletePin">Delete pin</button>':'')+'<button type="submit" class="primary">Save location</button></div></form>'});$('pinForm').onsubmit=async e=>{e.preventDefault();const m=state.maps.find(m=>m.id===targetMap.id);if(!m)return toast('This map was removed.');const pin={id:p?.id||crypto.randomUUID(),name:$('pinName').value.trim(),kind:$('pinKind').value,noteId:$('pinNote').value,description:$('pinDesc').value,x:pos.lng,y:pos.lat};if(!pin.name)return;const old=m.pins;if(p)m.pins=m.pins.map(x=>x.id===p.id?pin:x);else m.pins=[...m.pins,pin];try{await save();closeModal();renderPins();toast('Location saved to your atlas.')}catch{m.pins=old;renderPins()}};if(p)$('deletePin').onclick=async()=>{const m=state.maps.find(m=>m.id===targetMap.id);if(!m)return;const old=m.pins;m.pins=old.filter(x=>x.id!==p.id);try{await save();closeModal();renderPins()}catch{m.pins=old}}}
function resolveNote(target,base=''){let t=decodeURIComponent(target).split('#')[0].replace(/\.md$/i,'');const folder=base.split('/').slice(0,-1).join('/');return state.notes.find(n=>n.path.replace(/\.md$/i,'')===t)||state.notes.find(n=>n.path.replace(/\.md$/i,'')===(folder?folder+'/':'')+t)||state.notes.find(n=>n.title.toLowerCase()===t.toLowerCase().split('/').pop())}
function asset(target,base=''){return resolveMedia(state.assets,target,base)}
let noteMaps=[];
function clearNoteMaps(){for(const entry of noteMaps){entry.observer?.disconnect();entry.map.remove()}noteMaps=[]}
function noteImage(target,base){
 const [path,size]=target.split('|'),url=mediaURL(state.assets,path,base);
 if(!url)return '<span class="note-media-error">Missing attachment: '+esc(path)+'</span>';
 const dimensions=/^(\d+)(?:x(\d+))?$/.exec(size||'');
 return '<img class="note-image" src="'+esc(url)+'" alt="'+esc(path)+'"'+(dimensions?' width="'+Math.min(4096,+dimensions[1])+'"'+(dimensions[2]?' height="'+Math.min(4096,+dimensions[2])+'"':''):'')+'>';
}
function buildNoteHTML(n,configs=[],omitMaps=false){
 const text=transformNoteMedia(n.text.replace(/^---\s*\r?\n[\s\S]*?\r?\n---\s*\r?\n/,''),{
  image:target=>noteImage(target,n.path),
  wikilink:value=>{const [target,label]=value.split('|'),found=resolveNote(target,n.path);return '<button class="wikilink" data-'+(found?'note="'+esc(found.id):'missing="'+esc(target))+'">'+esc(label||target)+'</button>'},
  map:config=>{if(omitMaps)return '';const index=configs.push(config)-1;return '\n<div class="note-map-frame" data-inline-map="'+index+'"></div>\n'}
 });
 const renderer=window.marked?new marked.Renderer():null;
 if(renderer)renderer.image=({href,text,title})=>{
  const url=mediaURL(state.assets,href,n.path);
  return url?'<img class="note-image" src="'+esc(url)+'" alt="'+esc(text)+'"'+(title?' title="'+esc(title)+'"':'')+'>':'<span class="note-media-error">Missing attachment: '+esc(href)+'</span>';
 };
 return window.marked&&window.DOMPurify?DOMPurify.sanitize(marked.parse(text,{renderer}),{ADD_ATTR:['data-note','data-missing','data-inline-map'],ADD_TAGS:['button']}):'<pre>'+esc(n.text)+'</pre>';
}
function wireNoteContent(container,n,configs=[]){
 container.querySelectorAll('img').forEach(img=>{const url=mediaURL(state.assets,img.getAttribute('src'),n.path);if(url)img.src=url;else{img.removeAttribute('src');img.alt='Attachment not imported'}img.addEventListener('error',()=>{img.alt='Could not load image: '+img.alt},{once:true})});
 container.querySelectorAll('a').forEach(a=>{const href=a.getAttribute('href')||'';if(!/^(https?:|mailto:|#)/i.test(href))a.onclick=e=>{e.preventDefault();const found=resolveNote(href,n.path);found?openNote(found.id):toast('Linked note not found: '+href)};else{a.target='_blank';a.rel='noopener noreferrer'}});
 container.querySelectorAll('[data-inline-map]').forEach(frame=>mountNoteMap(frame,configs[+frame.dataset.inlineMap],n));
}
let mapNoteKey='';
function renderMapNote(){
 const panel=$('mapNotePanel'),container=$('mapNoteText');if(!panel||!container)return;
 const note=matchingMapNote(state.notes,current());
 panel.classList.toggle('hidden',!note);
 if(!note){container.innerHTML='';mapNoteKey='';return}
 const key=JSON.stringify([note.id,note.text,state.assets]);if(key===mapNoteKey)return;
 mapNoteKey=key;container.innerHTML=buildNoteHTML(note,[],true);wireNoteContent(container,note);
}
function addMapControls(instance,layer,atlas=false){
 const back=L.control({position:'bottomleft'});
 back.onAdd=()=>{const box=L.DomUtil.create('div','leaflet-bar map-back-control');const button=L.DomUtil.create('button','',box);button.type='button';button.textContent='Back';button.setAttribute('aria-label','Back to previous map');
 if(atlas){button.id='returnMap';button.onclick=returnToMap}else button.onclick=returnToMap;
 L.DomEvent.disableClickPropagation(box);L.DomEvent.disableScrollPropagation(box);return box};back.addTo(instance);
 const toggle=L.control({position:'topright'});
 toggle.onAdd=()=>{const box=L.DomUtil.create('div','leaflet-bar marker-toggle-control');const button=L.DomUtil.create('button','',box);button.type='button';button.textContent='Hide markers';button.setAttribute('aria-pressed','false');
 button.onclick=()=>{const hidden=instance.hasLayer(layer);if(hidden)instance.removeLayer(layer);else instance.addLayer(layer);button.textContent=hidden?'Show markers':'Hide markers';button.setAttribute('aria-pressed',String(hidden))};
 L.DomEvent.disableClickPropagation(box);L.DomEvent.disableScrollPropagation(box);return box};toggle.addTo(instance);
 if(atlas)updateReturnButton();
}

function openNote(id){
 const n=state.notes.find(x=>x.id===id);if(!n)return toast('Note not found.');
 if(isMapNote(n))return openAtlasMap('vault-'+n.id+'-0');
 const origin=noteOrigin||((view==='atlas'||viewingVaultMap)?captureMapView():null);
 closeModal();noteOrigin=origin;setView('note');activeNoteId=id;
 recent=[id,...recent.filter(x=>x!==id)].slice(0,6);
 const configs=[];$('noteBody').innerHTML=buildNoteHTML(n,configs);$('noteBody').dataset.noteId=id;
 $('pageTitle').textContent=n.title;$('breadcrumb').textContent='Notes / '+n.title;
 document.title=n.title+' · Everwood';wireNoteContent($('noteBody'),n,configs);
 $('downloadNote').onclick=()=>download(n.title+'.md',n.text,'text/markdown');render();window.scrollTo({top:0});
}

async function mountNoteMap(frame,config,note){
 try{
  if(!window.L)throw Error('Leaflet could not load. Check your internet connection and reload.');
  if(!config.image)throw Error('This map needs an image: [[Map image.png]] setting.');
  const url=mediaURL(state.assets,config.image,note.path);if(!url)throw Error('Map image not found: '+config.image);
  const image=new Image();image.src=url;await image.decode();if(!frame.isConnected)return;
  frame.innerHTML='<div class="note-map-bar"><span>'+esc(config.id||'Interactive map')+'</span></div><div class="note-map-canvas" role="region" aria-label="Interactive map: '+esc(config.id||note.title)+'"></div>';
  const canvas=frame.querySelector('.note-map-canvas');canvas.style.height=config.height+'px';
  const maxZoom=Number.isFinite(Number(config.maxZoom))?Math.min(20,Math.max(1,Number(config.maxZoom))):10;
  const instance=L.map(canvas,{crs:L.CRS.Simple,minZoom:-12,maxZoom,scrollWheelZoom:config.noScrollZoom!=='true'});
  const entry={map:instance};noteMaps.push(entry);const inlineMarkers=L.layerGroup().addTo(instance);addMapControls(instance,inlineMarkers);
  const bounds=config.bounds||[[0,0],[image.naturalHeight,image.naturalWidth]];
  L.imageOverlay(url,bounds).addTo(instance);
  const fit=()=>instance.fitBounds(bounds,{padding:[10,10]});fit();
  const fitZoom=instance.getZoom();instance.setMinZoom(Math.min(fitZoom,Number(config.minZoom)||-4));
  if(config.bounds&&config.lat!==undefined&&config.long!==undefined&&Number.isFinite(+config.lat)&&Number.isFinite(+config.long))instance.setView([+config.lat,+config.long],Number(config.defaultZoom)||fitZoom);

  instance.setMaxBounds(L.latLngBounds(bounds).pad(1));
  const markerList=[...config.markers.map(marker=>{const p=leafletPosition(config,{width:image.naturalWidth,height:image.naturalHeight},marker.lat,marker.lng);return {...marker,lat:p.y,lng:p.x}}),...savedLeafletPins(state,config,note,{width:image.naturalWidth,height:image.naturalHeight}).map(p=>({lat:p.y,lng:p.x,kind:p.kind,link:state.notes.find(n=>n.id===p.noteId)?.path||p.name}))];
  markerList.forEach(marker=>{const label=marker.link.replace(/^\[\[|\]\]$/g,''),[target,alias]=label.split('|');const pin=L.marker([marker.lat,marker.lng],{icon:leafletMarkerIcon(marker.kind)}).addTo(inlineMarkers);const tooltip=document.createElement('span');tooltip.textContent=alias||target||marker.kind;pin.bindTooltip(tooltip);pin.on('click',()=>{const found=resolveNote(target,note.path);found?openNote(found.id):toast('Linked note not found: '+target)})});
  if(window.ResizeObserver){entry.observer=new ResizeObserver(()=>instance.invalidateSize());entry.observer.observe(canvas)}
  requestAnimationFrame(()=>{if(frame.isConnected)instance.invalidateSize()});
 }catch(error){if(frame.isConnected)frame.innerHTML='<div class="note-media-error">'+esc(error.message)+'</div>'}
}

document.addEventListener('click',e=>{const b=e.target.closest('[data-missing]');if(b)toast('Import the linked note: '+b.dataset.missing)});
function download(name,body,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('backToMaps').onclick=()=>setView('maps');
$('search').oninput=render;$('menu').onclick=()=>$('sidebar').classList.toggle('open');$('mapSelect').onchange=e=>openAtlasMap(e.target.value);

// Local-only endpoint; hosted Sites continue using their existing storage.
let checkingLocalVault=false;
async function refreshLocalVault(){
 if(!loaded||!state?.localRevision||checkingLocalVault)return;
 checkingLocalVault=true;
 try{
  await saveChain.catch(()=>{});
  const info=await(await api('/api/local-vault')).json();
  if(info.revision!==state.localRevision){
   const fresh=await(await api('/api/state')).json();
   const openId=view==='note'?activeNoteId:null;
   // Keep maps and in-progress pin forms owned by this browser.
   state.notes=fresh.notes;state.assets=fresh.assets;state.leafletData=fresh.leafletData;
   await syncVaultAtlas();state.localRevision=fresh.localRevision;
   if(viewingVaultMap){if(state.maps.some(m=>m.id===activeMap))loadMap();else setView('maps')}
   render();
   if(openId){if(state.notes.some(n=>n.id===openId))openNote(openId);else{setView('notes');toast('This note was removed or renamed in Obsidian.')}}
  }
  $('statusText').textContent='Live sync · Obsidian Campaign';$('statusDot').style.background='#8eb38a';
 }catch(e){$('statusText').textContent='Live sync paused · retrying';$('statusDot').style.background='#d3b77a'}
 finally{checkingLocalVault=false}
}
setInterval(refreshLocalVault,2000);
window.addEventListener('focus',refreshLocalVault);

(async()=>{try{const r=await api('/api/state');state=await r.json();loaded=true;if(!state){state=emptyState();await save()}storageOK=true;$('statusText').textContent='All changes saved'}catch(e){state=emptyState();$('statusText').textContent='Vault storage offline';$('statusDot').style.background='#d3b77a';toast(e.message)}removeSampleContent(state);state.assets??=[];await syncVaultAtlas();activeMap=state.maps[0]?.id;render();initMap();if(current()?.sourceNoteId)openAtlasMap(activeMap);if(state.hosted)$('statusText').textContent='Everwood';refreshLocalVault()})();
</script></body></html>
