<div class="app"><aside class="sidebar" id="sidebar" tabindex="0" aria-label="Workspace navigation"><div class="brand">Everwood</div><div class="eyebrow" style="padding-left:14px">Workspace</div><nav class="nav"><button class="active" data-view="home"><span aria-hidden="true">⌂</span><span>Party overview</span></button><button data-view="notes">▤ <span>All notes</span><span class="badge" id="noteCount">0</span></button></nav><div class="eyebrow" style="padding-left:14px">Recently opened</div><div class="side-notes" id="sideNotes"></div></aside>

<section id="homeView"><h2 class="party-title">The Heroes</h2><div class="party-grid" id="partyCards"></div></section><section id="notesView" class="hidden"><div class="section-head"><h2>Notes</h2><div class="notes-header-controls"><span class="eyebrow" id="notesSummary"></span></div></div><div class="note-tree" id="allNotes"></div></section><section id="noteView" class="hidden note-page"><article class="markdown" id="noteBody"></article><div class="note-page-actions"><button id="downloadNote">Download Markdown</button></div></section></div></main></div>
<div class="toast hidden" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script>
/*__NOTE_MEDIA__*/
/*__ZOOM_RENDERER__*/
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function emptyState(){return {notes:[],assets:[],maps:[]}}
let loaded=false;let state,view='home',activeMap=null,map,recent=[],toastTimer;
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),4500)}
async function api(url,options){const r=await fetch(url,options);if(!r.ok){let m;try{m=(await r.json()).error}catch{}throw Error(m||'Request failed. Please try again.')}return r}
let viewingVaultMap=false;
let mapTrail=[],noteOrigin=null,activeNoteId=null;
function captureMapView(){const selected=current();if(!selected)return null;return {id:selected.id,center:map?.getCenter(),zoom:map?.getZoom()}}
function updateReturnButton(){const available=mapTrail.some(entry=>state.maps.some(m=>m.id===entry.id));map?.setBackAvailable(available&&(view==='atlas'||viewingVaultMap))}
function returnToMap(){
 const target=noteOrigin||mapTrail.pop();
 if(!target)return;
 if(!state.maps.some(m=>m.id===target.id)){noteOrigin=null;updateReturnButton();return toast('Previous map is no longer available.');}
 noteOrigin=null;openAtlasMap(target.id,{remember:false,restore:target});
}
function current(){return state.maps.find(m=>m.id===activeMap)||state.maps[0]}
async function syncVaultAtlas(){
 const next=await buildVaultAtlas(state,async url=>{const image=new Image();image.decoding='async';image.src=url;await image.decode();return {width:image.naturalWidth,height:image.naturalHeight}});
 state.maps=next;
}
function openAtlasMap(id,options={}){
 const selected=state.maps.find(m=>m.id===id);if(!selected)return toast('Map is not available yet.');
 if(options.remember!==false&&activeMap!==id&&(view==='atlas'||viewingVaultMap||noteOrigin)){const previous=noteOrigin||captureMapView();if(previous){mapTrail.push(previous);if(mapTrail.length>100)mapTrail.shift()}}
 clearNoteMaps();noteOrigin=null;activeMap=id;
 {setView('locations');viewingVaultMap=true;$('notesView').classList.add('hidden');$('atlasView').classList.remove('hidden');$('breadcrumb').textContent='Locations / '+displayNoteTitle(selected.name)}
 document.title=selected.name+' · Everwood';loadMap();if(options.restore?.center&&map)map.setView(options.restore.center,options.restore.zoom);updateReturnButton();setTimeout(()=>map?.invalidateSize(),50);
}
function updateNoteCards(id,html){
 const container=$(id);
 if(container._cardsHTML===html)return;
 container._cardsHTML=html;container.innerHTML=html;
}
function renderParty(){
 const q=$('search').value.trim().toLowerCase();
 const party=state.notes.filter(isLivingPlayerCharacter).sort((a,b)=>a.path.localeCompare(b.path,undefined,{numeric:true}));
 const matches=party.filter(n=>matchesNoteTitle(n,q));
 updateNoteCards('partyCards',matches.map(n=>{
  const details=characterOverview(n),portrait=characterPortrait(n,state.assets),title=displayNoteTitle(n.title);
  return '<button class="party-card" data-note="'+esc(n.id)+'">'+(portrait?'<img class="party-portrait" src="'+esc(portrait)+'" alt="Portrait of '+esc(title)+'" width="320" height="400" decoding="async">':'<div class="party-placeholder" aria-hidden="true">'+esc(title.slice(0,1))+'</div>')+'<div class="party-copy"><h2>'+esc(title)+'</h2><p>'+esc(details.description)+'</p><dl class="party-facts"><div><dt>Ancestry</dt><dd>'+esc(details.ancestry)+'</dd></div><div><dt>Class</dt><dd>'+esc(details.className)+'</dd></div><div><dt>Level</dt><dd>'+esc(details.level)+'</dd></div></dl><span>View character →</span></div></button>';
 }).join('')||'<div class="empty">'+(party.length?'No matching player characters.':'No living player characters found in the vault.')+'</div>');
}
function renderSearch(){
 const q=$('search').value.trim().toLowerCase(),panel=$('searchResults');
 panel.classList.toggle('hidden',!q);
 if(!q){panel.innerHTML='';return}
 const matches=state.notes.filter(n=>matchesNoteTitle(n,q)).sort((a,b)=>Number(b.title.toLowerCase().includes(q))-Number(a.title.toLowerCase().includes(q))||a.title.localeCompare(b.title));
 panel.innerHTML='<div class="search-count" role="status">'+matches.length+' matching notes</div>'+matches.slice(0,8).map(noteCard).join('')+(matches.length?'':'<div class="empty">No matching notes.</div>');
}
function render(){
 renderSearch();
 renderParty();
 renderWorkspaceTypes();
 const regularNotes=state.notes;
 $('noteCount').textContent=regularNotes.length;
 const recentNotes=recent.length?recent.map(id=>regularNotes.find(n=>n.id===id)).filter(Boolean):regularNotes.slice(0,5);
 $('sideNotes').innerHTML=recentNotes.map(n=>'<button data-note="'+esc(n.id)+'">▤ &nbsp; '+esc(displayNoteTitle(n.title))+'</button>').join('');
 const q=$('search').value.trim().toLowerCase();
 const matches=n=>matchesNoteTitle(n,q);
 const notes=regularNotes.filter(matches);
 renderNoteTree(state.notes.filter(matches),q);
 const controls=$('notesSummary').parentElement;
 controls.querySelector('[data-status-colors]')?.remove();
 if(view==='characters')controls.insertAdjacentHTML('beforeend','<button type="button" class="status-colors-switch" data-status-colors role="switch" aria-checked="'+statusColorsEnabled+'" aria-label="Status colors" title="Status colors"><span class="switch-label">Status colors</span><span class="switch-track" aria-hidden="true"></span></button>');
 $('notesSummary').textContent=state.notes.filter(matches).filter(n=>!noteTypes[view]||noteTypeForNote(n)===view).length+' notes';
 $('mapSelect').innerHTML=state.maps.map(m=>'<option value="'+esc(m.id)+'">'+esc(displayNoteTitle(m.name))+'</option>').join('');
 $('mapSelect').value=current()?.id||'';
 renderPins();renderMapNote();
}

const expandedNoteFolders=new Set();
const noteTypes={characters:'Characters',encounters:'Encounters',factions:'Factions',locations:'Locations',sessions:'Sessions',templates:'Templates'};
function noteType(name){return folderPresentation(name).label.toLowerCase()}
function noteTypeForNote(note){return noteType(String(note.path||'').replaceAll('\\','/').split('/')[0])}
function renderWorkspaceTypes(){
 const nav=document.querySelector('.sidebar .nav');
 if(nav.querySelector('[data-note-type]'))return;
 const folders=buildNoteTree(state.notes).folders;
 nav.querySelector('[data-view="notes"]').insertAdjacentHTML('afterend',Object.entries(noteTypes).map(([key,label])=>'<button data-note-type="'+key+'" data-view="'+key+'"><span aria-hidden="true">'+esc(folderPresentation(folders.find(f=>noteType(f.name)===key)?.name||'').emoji||'•')+'</span><span>'+label+'</span></button>').join(''));
}
let statusColorsEnabled=true;
function folderPresentation(name){
 const segments=[...new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(name)].map(s=>s.segment);
 const isEmoji=s=>/[\p{Extended_Pictographic}\p{Regional_Indicator}\u20e3]/u.test(s);
 return {emoji:segments.filter(isEmoji).join(''),label:displayNoteTitle(segments.filter(s=>!isEmoji(s)).join('').replace(/\s+/g,' ').trim()||name)};
}
function renderNoteTree(notes,query=''){
 let root=buildNoteTree(notes,{statusColors:statusColorsEnabled});
 if(noteTypes[view])root=root.folders.find(folder=>noteType(folder.name)===view)||{folders:[],notes:[]};
 const branch=node=>node.folders.map(folder=>{
  const count=countNotes(folder),presentation=folderPresentation(folder.name);
  const statusSwitch=/^characters$/i.test(presentation.label)?'<button type="button" class="status-colors-switch" data-status-colors role="switch" aria-checked="'+statusColorsEnabled+'" aria-label="Status colors" title="Status colors"><span class="switch-label">Status colors</span><span class="switch-track" aria-hidden="true"></span></button>':'';
  const type=noteType(folder.name);
  if(node===root&&view==='notes'&&noteTypes[type])return '<div class="note-folder"><div class="category-heading"><button class="category-link" data-view="'+type+'"><span class="'+(presentation.emoji?'folder-emoji':'folder-icon')+'" aria-hidden="true">'+esc(presentation.emoji)+'</span><span>'+esc(presentation.label)+'</span><span class="folder-count">'+count+'</span></button>'+statusSwitch+'</div></div>';
  return '<details class="note-folder" data-folder="'+esc(folder.path)+'"'+(query||expandedNoteFolders.has(folder.path)?' open':'')+'><summary><span class="'+(presentation.emoji?'folder-emoji':'folder-icon')+'" aria-hidden="true">'+esc(presentation.emoji)+'</span><span>'+esc(presentation.label)+'</span><span class="folder-count">'+count+'</span>'+statusSwitch+'</summary><div class="folder-children">'+branch(folder)+'</div></details>';
 }).join('')+(node.notes.length?'<div class="folder-notes">'+node.notes.map(noteCard).join('')+'</div>':'');
 function countNotes(node){return node.notes.length+node.folders.reduce((total,folder)=>total+countNotes(folder),0)}
 updateNoteCards('allNotes',branch(root)||'<div class="empty">No matching notes.</div>');
}
$('allNotes').addEventListener('toggle',event=>{
 const folder=event.target;if(!folder.matches?.('details[data-folder]')||$('search').value.trim())return;
 if(folder.open)expandedNoteFolders.add(folder.dataset.folder);else expandedNoteFolders.delete(folder.dataset.folder);
 // Preserve the native details state when the next render compares markup.
 $('allNotes')._cardsHTML=$('allNotes').innerHTML;
},true);

function noteCard(n){
 const {excerpt,artwork,isMap,isSession,dead,sepia}=notePreview(n,state),title=displayNoteTitle(n.title);
 return '<button class="card'+(artwork?' has-portrait':'')+(isMap?' has-map-preview':'')+(isSession?' session-card':'')+(dead?' is-dead':'')+(sepia?' is-sepia':'')+'" data-note="'+esc(n.id)+'"><div class="card-copy"><h3>'+esc(title)+'</h3><p>'+esc(excerpt)+'</p></div>'+(artwork?'<img class="card-portrait'+(isMap?' card-map-preview':'')+'" src="'+esc(artwork)+'" alt="'+(isMap?'Map of ':isSession?'Scene from ':'Portrait of ')+esc(title)+'" width="96" height="120" loading="lazy" decoding="async" fetchpriority="low">':'')+'</button>';
}
function setView(v,options={}){if(v==='atlas'){activeMap=worldAtlasMap(state.maps)?.id;if(!options.keepTrail)mapTrail=[];}document.title='Everwood';clearNoteMaps();view=v;if(v!=='note'){activeNoteId=null;noteOrigin=null;}viewingVaultMap=false;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===(v==='note'?'notes':v)));for(const x of ['home','atlas','notes','note'])$(x+'View').classList.toggle('hidden',x!==(noteTypes[v]?'notes':v));$('breadcrumb').textContent={home:'Party overview',atlas:'World atlas',notes:'All notes',note:'Notes'}[v];if(noteTypes[v]){$('breadcrumb').textContent=noteTypes[v];document.title=noteTypes[v]+' — Everwood'}$('notesView').querySelector('h2').textContent=noteTypes[v]||'Notes';$('sidebar').classList.remove('open');if(v==='atlas'){loadMap();setTimeout(()=>map?.invalidateSize(),50)}render();updateReturnButton()}
document.addEventListener('click',e=>{const v=e.target.closest('[data-view]'),n=e.target.closest('[data-note]'),m=e.target.closest('[data-map]');if(v)setView(v.dataset.view);if(n)openNote(n.dataset.note);if(m)openAtlasMap(m.dataset.map)});
function initMap(){map=new ZoomMapRenderer($('map'),{onBack:returnToMap,onPin:showPin,markerHTML:pin=>markerBubble(pin.kind),onError:message=>{$('mapError').textContent=message;$('mapError').classList.remove('hidden')}});loadMap()}
function loadMap(){
 if(!map)return;const m=current();$('mapError').classList.toggle('hidden',!!m&&!m.error);$('mapError').textContent=m?.error||(!m?'Choose a map from Locations.':'');
 if(!m||m.error){map.clear();$('locations').innerHTML='';$('pinCount').textContent='0 places';return}
 activeMap=m.id;map.setMap(m,{preserve:map.data?.id===m.id});render();updateReturnButton();
}
function markerSymbol(type){
 const d=markerDefinition(state,type),style='color:#fff;font-size:14px;line-height:1';
 if(d.isImage){const url=/^data:image\/(?:svg\+xml|png|webp|gif);/i.test(d.iconName)?d.iconName:mediaURL(state.assets,d.iconName);if(url)return '<img class="marker-custom-image" src="'+esc(url)+'" alt="" style="width:16px;height:16px;filter:brightness(0) invert(1)">'}
 return '<i aria-hidden="true" class="fa-solid fa-'+esc(d.isImage?'map-marker':d.iconName)+'" style="'+style+'"></i>';
}
function markerBubble(type){const d=markerDefinition(state,type);return '<div class="pin" style="background-color:'+d.color+';border-color:'+d.color+'"><span>'+markerSymbol(type)+'</span></div>'}
function renderPins(){
 const m=current();if(!m)return;const q=$('search').value.trim().toLowerCase();
 const pins=m.pins.filter(p=>p.name.toLowerCase().includes(q)).sort((a,b)=>String(a.kind).localeCompare(String(b.kind),undefined,{sensitivity:'base',numeric:true})||a.name.localeCompare(b.name,undefined,{sensitivity:'base',numeric:true}));
 $('pinCount').textContent=pins.length+' places';$('locations').innerHTML=pins.map(p=>'<button class="location" data-pin="'+esc(p.id)+'"><span class="pin-symbol" style="background-color:'+markerDefinition(state,p.kind).color+';border-color:'+markerDefinition(state,p.kind).color+'">'+markerSymbol(p.kind)+'</span><span><b>'+esc(p.name)+'</b><small>'+esc(markerDefinition(state,p.kind).type)+'</small></span></button>').join('')||'<div class="empty">No locations.</div>';
 map?.setPins(pins);
}
$('locations').onclick=e=>{const b=e.target.closest('[data-pin]');if(b){const p=current().pins.find(p=>p.id===b.dataset.pin);showPin(p)}};
function showPin(p){
 if(!p)return;
 if(p.noteId)return openNote(p.noteId);
 if(p.mapId)return openAtlasMap(p.mapId);
 toast('This pin has no linked note or map.');
}

function resolveNote(target,base=''){return resolveVaultNote(state.notes,target,base)}
function asset(target,base=''){return resolveMedia(state.assets,target,base)}
let noteMaps=[];
function clearNoteMaps(){for(const entry of noteMaps){entry.observer?.disconnect();entry.map.remove()}noteMaps=[]}
function noteImage(target,base){
 const [path,size]=target.split('|'),url=mediaURL(state.assets,path,base);
 if(!url)return '<span class="note-media-error">Missing attachment: '+esc(path)+'</span>';
 const dimensions=/^(\d+)(?:x(\d+))?$/.exec(size||'');
 return '<img class="note-image" src="'+esc(url)+'" alt="'+esc(path)+'"'+(dimensions?' width="'+Math.min(4096,+dimensions[1])+'"'+(dimensions[2]?' height="'+Math.min(4096,+dimensions[2])+'"':''):'')+'>';
}
function buildNoteHTML(n,configs=[],omitMaps=false){
 const session=sessionImage(n,state.assets);
 const banner=session?'<figure class="session-note-art"><img class="note-image" src="'+esc(session.url)+'" alt="Scene from '+esc(displayNoteTitle(n.title))+'"'+(session.width&&session.height?' width="'+session.width+'" height="'+session.height+'"':'')+' decoding="async" fetchpriority="high"></figure>':'';

 const text=transformNoteMedia(stripNoteComments(n.text).replace(/^---\s*\r?\n[\s\S]*?\r?\n---\s*\r?\n/,''),{
  image:target=>session&&mediaURL(state.assets,target.split('|')[0],n.path)===session.url?'':noteImage(target,n.path),
  wikilink:value=>{const [target,label]=value.split('|');if(target.startsWith('#'))return '<a class="wikilink" href="#'+noteHeadingId(target.slice(1))+'">'+esc(label||target.slice(1))+'</a>';const found=resolveNote(target,n.path);return '<button class="wikilink" data-'+(found?'note="'+esc(found.id):'missing="'+esc(target))+'">'+esc(label||target)+'</button>'},
  map:config=>{if(omitMaps)return '';const index=configs.push(config)-1;return '\n<div class="note-map-frame" data-inline-map="'+index+'"></div>\n'}
 });
 const renderer=window.marked?new marked.Renderer():null;
 if(renderer)configureNoteLayout(renderer,marked);
 if(renderer)renderer.image=({href,text,title})=>{
  const url=mediaURL(state.assets,href,n.path);
  if(session&&url===session.url)return '';
  return url?'<img class="note-image" src="'+esc(url)+'" alt="'+esc(text)+'"'+(title?' title="'+esc(title)+'"':'')+'>':'<span class="note-media-error">Missing attachment: '+esc(href)+'</span>';
 };
 return window.marked&&window.DOMPurify?DOMPurify.sanitize(banner+marked.parse(text,{renderer}),{ADD_ATTR:['data-note','data-missing','data-inline-map'],ADD_TAGS:['button']}):banner+'<pre>'+esc(n.text)+'</pre>';
}
function wireNoteContent(container,n,configs=[]){
 makeNoteSectionsCollapsible(container);
 container.querySelectorAll('img').forEach(img=>{const url=mediaURL(state.assets,img.getAttribute('src'),n.path);if(url)img.src=url;else{img.removeAttribute('src');img.alt='Attachment not imported'}img.addEventListener('error',()=>{img.alt='Could not load image: '+img.alt},{once:true})});
 container.querySelectorAll('a').forEach(a=>{const href=a.getAttribute('href')||'';if(href.startsWith('#'))a.onclick=e=>{e.preventDefault();const target=Array.from(container.querySelectorAll('[id]')).find(el=>el.id===href.slice(1)||el.id===noteHeadingId(href.slice(1)));revealNoteSection(target);target?.scrollIntoView({behavior:'smooth',block:'start'})};else if(!/^(https?:|mailto:)/i.test(href))a.onclick=e=>{e.preventDefault();const found=resolveNote(href,n.path);found?openNote(found.id):toast('Linked note not found: '+href)};else{a.target='_blank';a.rel='noopener noreferrer'}});
 container.querySelectorAll('[data-inline-map]').forEach(frame=>mountNoteMap(frame,configs[+frame.dataset.inlineMap],n));
}
let mapNoteKey='';
function renderMapNote(){
 const panel=$('mapNotePanel'),container=$('mapNoteText');if(!panel||!container)return;
 const note=matchingMapNote(state.notes,current());
 panel.classList.toggle('hidden',!note);
 if(!note){container.innerHTML='';mapNoteKey='';return}
 const key=JSON.stringify([note.id,note.text,state.assets]);if(key===mapNoteKey)return;
 mapNoteKey=key;container.innerHTML=buildNoteHTML(note,[],true);wireNoteContent(container,note);
}
function openNote(id){
 const n=state.notes.find(x=>x.id===id);if(!n)return toast('Note not found.');
 if(isMapNote(n)&&hasZoomMap(n))return openAtlasMap('vault-'+n.id+'-0');
 const origin=noteOrigin||((view==='atlas'||viewingVaultMap)?captureMapView():null);
 clearNoteMaps();noteOrigin=origin;setView('note');activeNoteId=id;
 recent=[id,...recent.filter(x=>x!==id)].slice(0,6);
 const configs=[];$('noteBody').innerHTML=buildNoteHTML(n,configs);$('noteBody').dataset.noteId=id;
 $('breadcrumb').textContent='Notes / '+displayNoteTitle(n.title);
 document.title=displayNoteTitle(n.title)+' · Everwood';wireNoteContent($('noteBody'),n,configs);
 $('downloadNote').onclick=()=>download(n.title+'.md',n.text,'text/markdown');render();window.scrollTo({top:0});
}

async function mountNoteMap(frame,config,note){
 try{
  const url=mediaURL(state.assets,config.image,note.path);if(!url)throw Error('Map image not found: '+config.image);
  const artwork=resolveMedia(state.assets,config.image,note.path);let dimensions;
  if(artwork?.width>0&&artwork?.height>0)dimensions=artwork;else{const image=new Image();image.decoding='async';image.src=url;await image.decode();dimensions={width:image.naturalWidth,height:image.naturalHeight}}
  if(!frame.isConnected||frame.closest('.hidden'))return;const data=zoomMapData(state,config,note);
  const descriptor={...dimensions,url,minZoom:config.minZoom,maxZoom:config.maxZoom,imageRendering:config.imageRendering,responsive:config.responsive,panClamp:data?.panClamp!==false,pins:savedZoomPins(state,config,note,dimensions),overlays:[]};
  frame.style.height=config.height+'px';const renderer=new ZoomMapRenderer(frame,{onBack:returnToMap,onPin:showPin,markerHTML:pin=>markerBubble(pin.kind)});renderer.setMap(descriptor);renderer.setBackAvailable(!!noteOrigin||mapTrail.length>0);noteMaps.push({map:renderer});
 }catch(error){if(frame.isConnected)frame.innerHTML='<div class="note-media-error">'+esc(error.message)+'</div>'}
}

document.addEventListener('click',e=>{const b=e.target.closest('[data-missing]');if(b)toast('Import the linked note: '+b.dataset.missing)});
function download(name,body,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('search').addEventListener('input',()=>render());
$('search').addEventListener('focus',()=>{if(loaded)renderSearch()});
$('search').addEventListener('keydown',event=>{if(event.key==='Escape'){$('searchResults').classList.add('hidden');$('search').blur()}});
document.addEventListener('click',event=>{if(event.target.closest('#searchResults [data-note]'))$('search').value=''},true);
document.addEventListener('click',event=>{if(!event.target.closest('.vault-search')||event.target.closest('[data-note]'))queueMicrotask(()=>$('searchResults').classList.add('hidden'))});
$('menu').onclick=()=>$('sidebar').classList.toggle('open');$('mapSelect').onchange=e=>openAtlasMap(e.target.value);

// Local-only endpoint; hosted Sites continue using their existing storage.
let checkingLocalVault=false;
async function refreshLocalVault(){
 if(!loaded||!state?.localRevision||checkingLocalVault)return;
 checkingLocalVault=true;
 try{
  const info=await(await api('/api/local-vault')).json();
  if(info.revision!==state.localRevision){
   const fresh=await(await api('/api/state')).json();
   const openId=view==='note'?activeNoteId:null;
   // Refresh notes and marker data from the source vault.
   state.notes=fresh.notes;state.assets=fresh.assets;state.zoomData=fresh.zoomData;
   await syncVaultAtlas();state.localRevision=fresh.localRevision;
   if(viewingVaultMap||view==='atlas'){if(state.maps.some(m=>m.id===activeMap))loadMap();else setView('locations')}
   render();
   if(openId){if(state.notes.some(n=>n.id===openId))openNote(openId);else{setView('notes');toast('This note was removed or renamed in Obsidian.')}}
  }

 }catch{}finally{checkingLocalVault=false}
}
setInterval(refreshLocalVault,2000);
window.addEventListener('focus',refreshLocalVault);

function applyStatusColors(enabled){
 statusColorsEnabled=enabled;
 document.body.classList.toggle('status-colors-off',!enabled);
 document.querySelectorAll('[data-status-colors]').forEach(button=>button.setAttribute('aria-checked',String(enabled)));
 try{localStorage.setItem('atlas-status-colors',String(enabled))}catch{}
}
let savedStatusColors=true;
try{savedStatusColors=localStorage.getItem('atlas-status-colors')!=='false'}catch{}
applyStatusColors(savedStatusColors);
document.addEventListener('click',event=>{
 const button=event.target.closest('[data-status-colors]');if(!button)return;
 event.preventDefault();event.stopPropagation();applyStatusColors(!statusColorsEnabled);render();
},true);
// Synchronize note navigation with shareable URLs after the vault has loaded.
let routingReady=false,restoringRoute=false,navigationDepth=0;
function writeRoute(path){if(routingReady&&!restoringRoute&&location.pathname!==path)history.pushState(null,'',path)}
const originalSetView=setView,originalOpenNote=openNote,originalOpenAtlasMap=openAtlasMap;
setView=function(v,options={}){navigationDepth++;try{return originalSetView(v,options)}finally{navigationDepth--;if(!navigationDepth&&v!=='note')writeRoute(v==='home'?'/':noteTypes[v]?'/notes/'+v:v==='atlas'?'/':'/notes')}};
openNote=function(id){navigationDepth++;try{return originalOpenNote(id)}finally{navigationDepth--;const note=state.notes.find(n=>n.id===id);if(!navigationDepth&&note)writeRoute(noteURL(note,state.notes))}};
openAtlasMap=function(id,options={}){navigationDepth++;try{return originalOpenAtlasMap(id,options)}finally{navigationDepth--;if(!navigationDepth){const m=state.maps.find(m=>m.id===id),n=state.notes.find(n=>n.id===m?.sourceNoteId);if(n)writeRoute(noteURL(n,state.notes));else if(m)writeRoute('/')}}};
function restoreRoute(){
 if(!routingReady)return;
 restoringRoute=true;
 try{
  const type=location.pathname.match(/^\/notes\/(?:type\/)?([^/]+)\/?$/)?.[1];
  if(noteTypes[type]){setView(type);if(location.pathname!=='/notes/'+type)history.replaceState(null,'','/notes/'+type);}
  else if(location.pathname.startsWith('/notes/')){
   const note=routeNote(state.notes,location.pathname);
   if(note)openNote(note.id);
   else{setView('note');$('breadcrumb').textContent='Notes';$('noteBody').textContent='This note does not exist or has been renamed.';$('downloadNote').onclick=null;}
  }else setView(location.pathname==='/maps'?'locations':location.pathname==='/notes'?'notes':'home');
 }finally{restoringRoute=false}
}
window.addEventListener('popstate',restoreRoute);

(async()=>{try{const r=await api('/api/state');state=await r.json();loaded=true;if(!state)state=emptyState();}catch(e){state=emptyState();toast(e.message)}state.assets??=[];await syncVaultAtlas();activeMap=worldAtlasMap(state.maps)?.id;render();initMap();routingReady=true;restoreRoute();refreshLocalVault()})();
</script></body></html>
